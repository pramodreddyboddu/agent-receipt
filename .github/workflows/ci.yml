# Mirror / fallback copy of .github/workflows/ci.yml
# Canonical path: .github/workflows/ci.yml
# If GitHub OAuth lacks the `workflow` scope and you cannot push workflows,
# copy this file manually:
#   mkdir -p .github/workflows
#   cp docs/github-actions-ci.yml .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - name: CLI smoke
        run: |
          node bin/agent-receipt.js help
          node bin/agent-receipt.js version
          node bin/agent-receipt.js --version
