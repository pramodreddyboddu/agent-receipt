# Mirror / fallback copy of .github/workflows/release.yml
# Canonical path: .github/workflows/release.yml
# Trusted Publisher on npmjs.com must use workflow filename: release.yml
# If GitHub OAuth lacks the `workflow` scope and you cannot push workflows,
# copy this file manually:
#   mkdir -p .github/workflows
#   cp docs/github-actions-release.yml .github/workflows/release.yml
#
# npm Trusted Publishing (OIDC) — no long-lived NPM_TOKEN secret.
# Configure the Trusted Publisher on npmjs.com to match this file name exactly:
#   Organization/user: pramodreddyboddu
#   Repository: agent-receipt
#   Workflow filename: release.yml
#   Environment name: npm-publish  (must match `environment:` below)
# See docs/RELEASE.md for the full UI checklist.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # Node >= 22.14 and npm CLI >= 11.5.1 are required for OIDC publish.
      # setup-node@v4 with registry-url can write an empty _authToken that
      # blocks OIDC; prefer a recent setup-node and do not set NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:check

      # No NPM_TOKEN / NODE_AUTH_TOKEN — auth is OIDC via Trusted Publisher.
      # Provenance is generated automatically for public repos with Trusted Publishing.
      - name: Publish to npm (OIDC)
        run: npm publish --access public
