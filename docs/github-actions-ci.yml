# Intended CI workflow. Copy onto .github/workflows/ci.yml.
# Canonical path once installed: .github/workflows/ci.yml
#
# Updating that live file needs the GitHub OAuth `workflow` scope
# (in addition to `repo`). `gh auth status` must list `workflow`.
# Refresh:  gh auth refresh -h github.com -s workflow
# Fine-grained PAT: Actions Read and write. GitHub App: Workflows.
# Without it, GitHub rejects the push
# ("refusing to allow an OAuth App to create or update workflow
# `.github/workflows/ci.yml` without `workflow` scope").
# This mirror is the file to install:
#   mkdir -p .github/workflows
#   cp docs/github-actions-ci.yml .github/workflows/ci.yml
#
# v1.0.6 through v1.0.27: live .github/workflows/ci.yml was left
# unchanged because the checkout token's scopes were gist, read:org, repo
# (no workflow).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - name: CLI smoke
        run: |
          node bin/agent-receipt.js help
          node bin/agent-receipt.js help share
          node bin/agent-receipt.js help verify
          node bin/agent-receipt.js help import
          node bin/agent-receipt.js help audit
          node bin/agent-receipt.js help prune
          node bin/agent-receipt.js help doctor
          node bin/agent-receipt.js help prove
          node bin/agent-receipt.js help keygen
          node bin/agent-receipt.js help sign
          node bin/agent-receipt.js version
          node bin/agent-receipt.js --version
      - name: share --json smoke
        run: |
          set -eu
          tmp=$(mktemp -d)
          git -C "$tmp" init
          git -C "$tmp" config user.email ci@example.com
          git -C "$tmp" config user.name CI
          printf '# smoke\n' > "$tmp/README.md"
          git -C "$tmp" add README.md
          git -C "$tmp" commit -m smoke
          # Command comes first. A leading --cwd is parsed as help.
          node bin/agent-receipt.js init --cwd "$tmp"
          node bin/agent-receipt.js wrap --agent ci --message smoke --json --cwd "$tmp" > "$tmp/wrap.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="wrap"||g.exitCode!==0||typeof g.trailingIgnored!=="boolean"){console.error(g); process.exit(1)}' "$tmp/wrap.json"
          # v1.0.15: docs/gate.schema.json required keys are on the wrap gate
          # object. Drop-in examples live under examples/github/ (not this job).
          node -e 'const fs=require("fs"); const schema=JSON.parse(fs.readFileSync("docs/gate.schema.json","utf8")); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const req=schema.required||[]; if(!req.length){console.error("schema required empty"); process.exit(1)} for (const k of req) { if(!Object.prototype.hasOwnProperty.call(g,k)) { console.error("missing "+k); process.exit(1);} }' "$tmp/wrap.json"
          # prove-this-run: hash ok, trailing content evaluated, audit linked.
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="prove"||g.verified!==true||g.trailingIgnored!==false||g.exitCode!==0||!g.audit||g.audit.present!==true||g.audit.chainOk!==true||g.audit.matched!==true||typeof g.audit.events!=="number"||typeof g.sha256!=="string"||!g.signature||g.signature.present!==false||g.signature.ok!==null||g.signature.trusted!==null){console.error(g); process.exit(1)}' "$tmp/prove.json"
          # v1.0.16: local Ed25519 attest of the receipt sha256. Unsigned prove
          # above stays exit 0. keygen, sign, then prove reports signature.ok.
          node bin/agent-receipt.js keygen --json --cwd "$tmp" > "$tmp/keygen.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="keygen"||g.exitCode!==0||g.created!==true||g.rotated!==false||typeof g.fingerprint!=="string"||g.fingerprint.length!==64){console.error(g); process.exit(1)}' "$tmp/keygen.json"
          node bin/agent-receipt.js sign --json --cwd "$tmp" > "$tmp/sign.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="sign"||g.exitCode!==0||g.verified!==true||typeof g.sha256!=="string"||g.sha256.length!==64||typeof g.fingerprint!=="string"||typeof g.sigPath!=="string"){console.error(g); process.exit(1)}' "$tmp/sign.json"
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-signed.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const k=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); if(!g.ok||g.verified!==true||g.exitCode!==0||!g.signature||g.signature.present!==true||g.signature.ok!==true||g.signature.alg!=="ed25519"||g.signature.fingerprint!==k.fingerprint||g.signature.trusted!==null){console.error(g); process.exit(1)}' "$tmp/prove-signed.json" "$tmp/keygen.json"
          # v1.0.17: verify --require-sig on the signed receipt (exit 0) and
          # on an unsigned copy (exit 2). Default verify stays hash-only.
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" > "$tmp/verify-sig.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="verify"||g.exitCode!==0||g.verified!==true||!g.signature||g.signature.present!==true||g.signature.ok!==true||g.signature.alg!=="ed25519"){console.error(g); process.exit(1)}' "$tmp/verify-sig.json"
          node -e 'const fs=require("fs"); const path=require("path"); const sign=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const dest=path.join(process.argv[2],"unsigned.md"); fs.copyFileSync(sign.path, dest); fs.writeFileSync(path.join(process.argv[2],"unsigned.path"), dest);' "$tmp/sign.json" "$tmp"
          unsigned=$(cat "$tmp/unsigned.path")
          set +e
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" "$unsigned" > "$tmp/verify-nosig.json"
          nosig=$?
          set -e
          test "$nosig" = 2
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==false||g.exitCode!==2||!g.signature||g.signature.present!==false||g.signature.ok!==false||typeof g.reason!=="string"||g.reason.indexOf("signature absent")===-1){console.error(g); process.exit(1)}' "$tmp/verify-nosig.json"
          # v1.0.18: fingerprint trust store. Matching fingerprint passes
          # verify --require-sig. A different fingerprint exits 2 on verify
          # and prove. Removing the file leaves the allowlist inactive.
          fp=$(node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(g.signature.fingerprint);' "$tmp/verify-sig.json")
          printf '%s\n' "$fp" > "$tmp/.agent-receipt/trusted-keys.txt"
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" > "$tmp/verify-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/verify-trust.json"
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/prove-trust.json"
          printf '%s\n' 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > "$tmp/.agent-receipt/trusted-keys.txt"
          set +e
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" > "$tmp/verify-untrusted.json"
          untrusted=$?
          set -e
          test "$untrusted" = 2
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==false||g.exitCode!==2||!g.signature||g.signature.ok!==false||g.signature.trusted!==false||typeof g.reason!=="string"||g.reason.indexOf("fingerprint not trusted")===-1){console.error(g); process.exit(1)}' "$tmp/verify-untrusted.json"
          set +e
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-untrusted.json"
          puntrusted=$?
          set -e
          test "$puntrusted" = 2
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==false||g.exitCode!==2||!g.signature||g.signature.ok!==false||g.signature.trusted!==false||typeof g.reason!=="string"||g.reason.indexOf("trust store")===-1){console.error(g); process.exit(1)}' "$tmp/prove-untrusted.json"
          rm -f "$tmp/.agent-receipt/trusted-keys.txt"
          # v1.0.19: wrap --sign after keygen writes a sidecar. prove
          # signature.ok. With that fingerprint in the trust store, prove
          # signature.trusted and verify --require-sig exit 0.
          node bin/agent-receipt.js wrap --sign --agent ci --message signed-gate --json --cwd "$tmp" > "$tmp/wrap-sign.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="wrap"||g.exitCode!==0||typeof g.path!=="string"){console.error(g); process.exit(1)} const sig=g.path.replace(/\.md$/i,".sig.json"); if(!fs.existsSync(sig)){console.error("missing sidecar "+sig); process.exit(1)}' "$tmp/wrap-sign.json"
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-wrap-sign.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.verified!==true||g.exitCode!==0||!g.signature||g.signature.present!==true||g.signature.ok!==true||g.signature.alg!=="ed25519"){console.error(g); process.exit(1)}' "$tmp/prove-wrap-sign.json"
          fp=$(node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(g.signature.fingerprint);' "$tmp/prove-wrap-sign.json")
          printf '%s\n' "$fp" > "$tmp/.agent-receipt/trusted-keys.txt"
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-wrap-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/prove-wrap-trust.json"
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" > "$tmp/verify-wrap-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/verify-wrap-trust.json"
          rm -f "$tmp/.agent-receipt/trusted-keys.txt"
          # v1.0.20: trust add --self writes the local keygen fingerprint
          # into trusted-keys.txt. prove signature.trusted is true and
          # verify --require-sig exits 0. A second call is idempotent.
          node bin/agent-receipt.js trust add --self --json --cwd "$tmp" > "$tmp/trust-self.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const k=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); if(g.ok!==true||g.command!=="trust"||g.action!=="add"||g.exitCode!==0||g.added!==true||g.fingerprint!==k.fingerprint||!g.fingerprints||g.fingerprints.indexOf(k.fingerprint)===-1){console.error(g); process.exit(1)} const text=fs.readFileSync(process.argv[3],"utf8"); if(text.indexOf(k.fingerprint)===-1){console.error(text); process.exit(1)}' "$tmp/trust-self.json" "$tmp/keygen.json" "$tmp/.agent-receipt/trusted-keys.txt"
          node bin/agent-receipt.js prove --json --cwd "$tmp" > "$tmp/prove-self-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/prove-self-trust.json"
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" > "$tmp/verify-self-trust.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||!g.signature||g.signature.ok!==true||g.signature.trusted!==true){console.error(g); process.exit(1)}' "$tmp/verify-self-trust.json"
          node bin/agent-receipt.js trust add --self --json --cwd "$tmp" > "$tmp/trust-self-again.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.action!=="add"||g.added!==false||g.exitCode!==0){console.error(g); process.exit(1)}' "$tmp/trust-self-again.json"
          # v1.0.23: trust show is read-only. After keygen + trust add --self,
          # active is true, localListed is true, and localFingerprint matches.
          node bin/agent-receipt.js trust show --json --cwd "$tmp" > "$tmp/trust-show.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const k=JSON.parse(fs.readFileSync(process.argv[2],"utf8")); if(g.ok!==true||g.command!=="trust"||g.action!=="show"||g.exitCode!==0||g.active!==true||g.localListed!==true||g.localFingerprint!==k.fingerprint||!g.fingerprints||g.fingerprints.indexOf(k.fingerprint)===-1){console.error(g); process.exit(1)}' "$tmp/trust-show.json" "$tmp/keygen.json"
          rm -f "$tmp/.agent-receipt/trusted-keys.txt"
          # v1.0.21: prove --page writes a sibling Markdown one-pager.
          # --json --page adds pagePath. The page contains PROVED and sha256.
          # The one-pager is not signed. Default prove without --page writes nothing.
          node bin/agent-receipt.js prove --json --page --cwd "$tmp" > "$tmp/prove-page.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||g.verified!==true||typeof g.pagePath!=="string"||!g.pagePath.endsWith(".prove.md")||!fs.existsSync(g.pagePath)){console.error(g); process.exit(1)} const page=fs.readFileSync(g.pagePath,"utf8"); if(page.indexOf("PROVED")===-1||page.indexOf(g.sha256)===-1){console.error(page); process.exit(1)}' "$tmp/prove-page.json"
          # v1.0.27: prove --html writes a self-contained offline HTML report.
          # --json --html adds htmlPath. PASS banner, sha256, inline CSS only,
          # no http(s) asset references, no scripts. Not itself signed.
          node bin/agent-receipt.js prove --json --html --cwd "$tmp" > "$tmp/prove-html.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.exitCode!==0||typeof g.htmlPath!=="string"||!g.htmlPath.endsWith(".prove.html")||!fs.existsSync(g.htmlPath)){console.error(g); process.exit(1)} const h=fs.readFileSync(g.htmlPath,"utf8"); if(h.indexOf("PASS")===-1||h.indexOf(g.sha256)===-1||/<script|<link|src=|href=|@import|url\(/i.test(h)){console.error(h); process.exit(1)}' "$tmp/prove-html.json"
          if grep -Eq 'https?://' "$tmp"/.agent-receipt/receipts/*.prove.html; then echo "prove --html references http(s)"; exit 1; fi
          # v1.0.22: config sign: true. Keys are already present. Bare wrap
          # (no --sign flag) writes *.sig.json. --no-sign does not. Missing
          # keys tip and leave the receipt unsigned (exit is not 2).
          printf '\nsign: true\n' >> "$tmp/.agent-receipt.yml"
          node bin/agent-receipt.js wrap --agent ci --message config-sign --json --cwd "$tmp" > "$tmp/wrap-config-sign.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="wrap"||g.exitCode!==0||typeof g.path!=="string"){console.error(g); process.exit(1)} const sig=g.path.replace(/\.md$/i,".sig.json"); if(!fs.existsSync(sig)){console.error("missing sidecar "+sig); process.exit(1)}' "$tmp/wrap-config-sign.json"
          node bin/agent-receipt.js wrap --no-sign --agent ci --message config-nosign --json --cwd "$tmp" > "$tmp/wrap-config-nosign.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="wrap"||g.exitCode!==0||typeof g.path!=="string"){console.error(g); process.exit(1)} const sig=g.path.replace(/\.md$/i,".sig.json"); if(fs.existsSync(sig)){console.error("unexpected sidecar "+sig); process.exit(1)}' "$tmp/wrap-config-nosign.json"
          mv "$tmp/.agent-receipt/keys" "$tmp/.agent-receipt/keys.bak"
          node bin/agent-receipt.js wrap --agent ci --message config-sign-nokeys --json --cwd "$tmp" > "$tmp/wrap-config-sign-nokeys.json" 2> "$tmp/wrap-config-sign-nokeys.err"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="wrap"||g.exitCode!==0||typeof g.path!=="string"){console.error(g); process.exit(1)} const sig=g.path.replace(/\.md$/i,".sig.json"); if(fs.existsSync(sig)){console.error("unexpected sidecar "+sig); process.exit(1)} const err=fs.readFileSync(process.argv[2],"utf8"); if(err.indexOf("keygen")===-1){console.error(err); process.exit(1)}' "$tmp/wrap-config-sign-nokeys.json" "$tmp/wrap-config-sign-nokeys.err"
          mv "$tmp/.agent-receipt/keys.bak" "$tmp/.agent-receipt/keys"
          node bin/agent-receipt.js last --json --cwd "$tmp" > "$tmp/last.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="last"||typeof g.path!=="string"||typeof g.sha256!=="string"||g.sha256.length!==64){console.error(g); process.exit(1)}' "$tmp/last.json"
          # history --agent is an exact match. The wrap above used --agent ci.
          node bin/agent-receipt.js history --agent ci --json --cwd "$tmp" > "$tmp/history-agent.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||!g.length||g.some(e=>e.agent!=="ci"||typeof e.failedOn!=="boolean"||typeof e.uncommitted!=="boolean")){console.error(g); process.exit(1)}' "$tmp/history-agent.json"
          # Clean wrap is committed, so --uncommitted matches nothing. Empty is exit 0.
          node bin/agent-receipt.js history --uncommitted --json --cwd "$tmp" > "$tmp/history-uncommitted.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||g.some(e=>e.uncommitted!==true)){console.error(g); process.exit(1)}' "$tmp/history-uncommitted.json"
          # history --failed is gate memory. A clean wrap did not trip fail-on.
          # An empty array is exit 0. Same when combined with --agent ci.
          node bin/agent-receipt.js history --failed --json --cwd "$tmp" > "$tmp/history-failed.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||g.length!==0){console.error(g); process.exit(1)}' "$tmp/history-failed.json"
          node bin/agent-receipt.js history --agent ci --failed --json --cwd "$tmp" > "$tmp/history-agent-failed.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||g.some(e=>e.agent!=="ci"||e.failedOn!==true)){console.error(g); process.exit(1)}' "$tmp/history-agent-failed.json"
          node bin/agent-receipt.js share --json --cwd "$tmp" > "$tmp/share.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="share"||g.redacted!==true||g.exitCode!==0||typeof g.sha256!=="string"){console.error(g); process.exit(1)}' "$tmp/share.json"
          # v1.0.24: share --package after keygen. Keys are present, so the
          # package includes receipt.sig.json. verify --require-sig on
          # receipt.md exits 0. HTML stays unsigned. packagePath is set.
          node bin/agent-receipt.js wrap --sign --agent ci --message share-package --json --cwd "$tmp" > "$tmp/wrap-share-package.json"
          node bin/agent-receipt.js share --package --json --cwd "$tmp" > "$tmp/share-package.json"
          node -e 'const fs=require("fs"); const path=require("path"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="share"||g.exitCode!==0||typeof g.packagePath!=="string"||typeof g.htmlPath!=="string"||typeof g.markdownPath!=="string"||typeof g.sigPath!=="string"){console.error(g); process.exit(1)} const dir=g.packagePath; for (const name of ["receipt.md","receipt.html","receipt.sig.json","manifest.json"]) { if(!fs.existsSync(path.join(dir,name))){console.error("missing "+name); process.exit(1)} } if(g.htmlPath!==path.join(dir,"receipt.html")||g.markdownPath!==path.join(dir,"receipt.md")||g.sigPath!==path.join(dir,"receipt.sig.json")){console.error(g); process.exit(1)} const manifest=JSON.parse(fs.readFileSync(path.join(dir,"manifest.json"),"utf8")); if(manifest.kind!=="agent-receipt-share"||manifest.signed!==true||typeof manifest.fingerprint!=="string"||manifest.fingerprint.length!==64||manifest.redacted!==true){console.error(manifest); process.exit(1)} fs.writeFileSync(process.argv[2], g.markdownPath);' "$tmp/share-package.json" "$tmp/share-package-md.path"
          pkgmd=$(cat "$tmp/share-package-md.path")
          node bin/agent-receipt.js verify --require-sig --json --cwd "$tmp" "$pkgmd" > "$tmp/verify-share-package.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="verify"||g.exitCode!==0||g.verified!==true||!g.signature||g.signature.present!==true||g.signature.ok!==true){console.error(g); process.exit(1)}' "$tmp/verify-share-package.json"
          # v1.0.25: verify --package checks the manifest, file hashes, receipt,
          # receipt sidecar, and manifest.sig.json. With keys, --require-sig
          # exits 0. HTML stays unsigned. import copies receipt.md only.
          pkgdir=$(dirname "$pkgmd")
          node bin/agent-receipt.js verify --package --json --cwd "$tmp" "$pkgdir" > "$tmp/verify-package.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="verify"||g.exitCode!==0||g.verified!==true||g.filesOk!==true||g.manifestOk!==true||g.signed!==true||typeof g.sha256!=="string"||g.sha256.length!==64||g.packagePath!==process.argv[2]||!g.signature||g.signature.ok!==true||!g.manifestSig||g.manifestSig.present!==true||g.manifestSig.ok!==true){console.error(g); process.exit(1)}' "$tmp/verify-package.json" "$pkgdir"
          node bin/agent-receipt.js verify --package --require-sig --json --cwd "$tmp" "$pkgdir" > "$tmp/verify-package-require.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!g.ok||g.command!=="verify"||g.exitCode!==0||!g.signature||g.signature.present!==true||g.signature.ok!==true){console.error(g); process.exit(1)}' "$tmp/verify-package-require.json"
          node bin/agent-receipt.js audit --verify --cwd "$tmp"
          # Retention is opt-in: dry-run with no limits must delete nothing
          # and must not append audit.jsonl.
          before=$(wc -l < "$tmp/.agent-receipt/audit.jsonl")
          node bin/agent-receipt.js prune --dry-run --json --cwd "$tmp" > "$tmp/prune.json"
          after=$(wc -l < "$tmp/.agent-receipt/audit.jsonl")
          test "$before" = "$after"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="prune"||g.enabled!==false||g.dryRun!==true||g.exitCode!==0||g.audited!==0||g.deleted.length!==0||g.indexUpdated!==false||typeof g.version!=="string"){console.error(g); process.exit(1)}' "$tmp/prune.json"
          # Fail-closed org policy (1.0.14) and retention (1.0.17): unset
          # redact+failOn and unset maxCount/maxAgeDays fail doctor --strict
          # even on this small outDir. Default doctor stays exit 0 (both
          # rows INFO). init --org fixes policy only. init --retention
          # fixes retention. Both are required before --strict exits 0.
          node bin/agent-receipt.js doctor --json --cwd "$tmp" > "$tmp/doctor.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const ids=new Set((g.checks||[]).map(c=>c.id)); const need=["node","git","repo","outDir","cli","policy","retention","trust"]; const policy=(g.checks||[]).find(c=>c.id==="policy"); const retention=(g.checks||[]).find(c=>c.id==="retention"); const trust=(g.checks||[]).find(c=>c.id==="trust"); if(g.ok!==true||g.command!=="doctor"||g.exitCode!==0||g.strict!==false||typeof g.version!=="string"||!need.every(id=>ids.has(id))||g.checks.some(c=>!["pass","fail","warn","info"].includes(c.status)||typeof c.detail!=="string")||!policy||policy.status!=="info"||!retention||retention.status!=="info"||!trust||trust.status!=="info"){console.error(g); process.exit(1)}' "$tmp/doctor.json"
          set +e
          node bin/agent-receipt.js doctor --strict --json --cwd "$tmp" > "$tmp/doctor-strict-unset.json"
          strict_unset=$?
          set -e
          test "$strict_unset" = 1
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const policy=(g.checks||[]).find(c=>c.id==="policy"); const retention=(g.checks||[]).find(c=>c.id==="retention"); if(g.ok!==false||g.strict!==true||g.exitCode!==1||g.command!=="doctor"||!policy||policy.status!=="fail"||!retention||retention.status!=="fail"){console.error(g); process.exit(1)}' "$tmp/doctor-strict-unset.json"
          node bin/agent-receipt.js init --org --cwd "$tmp"
          set +e
          node bin/agent-receipt.js doctor --strict --json --cwd "$tmp" > "$tmp/doctor-strict-org.json"
          strict_org=$?
          set -e
          test "$strict_org" = 1
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const policy=(g.checks||[]).find(c=>c.id==="policy"); const retention=(g.checks||[]).find(c=>c.id==="retention"); if(g.ok!==false||g.exitCode!==1||g.strict!==true||!policy||policy.status!=="pass"||!retention||retention.status!=="fail"){console.error(g); process.exit(1)}' "$tmp/doctor-strict-org.json"
          node bin/agent-receipt.js init --retention --cwd "$tmp"
          node bin/agent-receipt.js doctor --strict --json --cwd "$tmp" > "$tmp/doctor-strict.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const policy=(g.checks||[]).find(c=>c.id==="policy"); const retention=(g.checks||[]).find(c=>c.id==="retention"); if(g.ok!==true||g.command!=="doctor"||g.exitCode!==0||g.strict!==true||!policy||policy.status!=="pass"||!retention||retention.status!=="pass"){console.error(g); process.exit(1)}' "$tmp/doctor-strict.json"
          # --event is listing-only. The wrap above must appear; share must not.
          node bin/agent-receipt.js audit --event wrap --json --cwd "$tmp" > "$tmp/audit-wrap.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||g.length<1||g.some(e=>e.event!=="wrap")){console.error(g); process.exit(1)}' "$tmp/audit-wrap.json"
          # --agent is an exact match. The wrap above used --agent ci.
          node bin/agent-receipt.js audit --agent ci --json --cwd "$tmp" > "$tmp/audit-agent.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||!g.some(e=>e.event==="wrap"&&e.agent==="ci")){console.error(g); process.exit(1)}' "$tmp/audit-agent.json"
          # --failed keeps failedOn or a nonzero exitCode, combined with --agent.
          # A clean wrap is absent. An empty array is exit 0, not an error.
          node bin/agent-receipt.js audit --agent ci --failed --json --cwd "$tmp" > "$tmp/audit-failed.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(g)||g.some(e=>e.agent!=="ci"||!(e.failedOn===true||e.exitCode!==0))){console.error(g); process.exit(1)}' "$tmp/audit-failed.json"
          # v1.0.26: autoPrune + maxCount deletes older receipts after wrap
          # and appends one prune audit line per delete. A broken audit chain
          # still exits 0 and deletes nothing. Not a daemon.
          node -e 'const fs=require("fs"); const p=process.argv[1]; const lines=fs.readFileSync(p,"utf8").split("\n"); function setKey(key,value){ let found=false; for (let i=0;i<lines.length;i++){ if(lines[i].startsWith(key+":")){ lines[i]=key+": "+value; found=true; } } if(!found) lines.push(key+": "+value); } setKey("maxCount","1"); setKey("autoPrune","true"); fs.writeFileSync(p, lines.join("\n").replace(/\n*$/,"\n"));' "$tmp/.agent-receipt.yml"
          count_receipts() { find "$tmp/.agent-receipt/receipts" -maxdepth 1 -type f -name 'receipt-*.md' ! -name '*.prove.md' | wc -l; }
          node bin/agent-receipt.js wrap --agent ci --message auto-prune --json --cwd "$tmp" > "$tmp/wrap-autoprune.json"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="wrap"||g.exitCode!==0||g.autoPrune!==true||typeof g.pruned!=="number"||g.pruned<1||g.pruneReason!==null){console.error(g); process.exit(1)} const lines=fs.readFileSync(process.argv[2],"utf8").trim().split("\n").filter(Boolean).map(function(line){return JSON.parse(line)}); const prunes=lines.filter(function(e){return e.event==="prune"}); if(prunes.length<1||prunes.length!==g.pruned){console.error(prunes.length,g); process.exit(1)}' "$tmp/wrap-autoprune.json" "$tmp/.agent-receipt/audit.jsonl"
          test "$(count_receipts | tr -d ' ')" = "1"
          printf '%s\n' '{"event":"wrap"}' >> "$tmp/.agent-receipt/audit.jsonl"
          before=$(count_receipts | tr -d ' ')
          node bin/agent-receipt.js wrap --agent ci --message auto-prune-broken --json --cwd "$tmp" > "$tmp/wrap-autoprune-broken.json" 2> "$tmp/wrap-autoprune-broken.err"
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(g.ok!==true||g.command!=="wrap"||g.exitCode!==0||g.autoPrune!==true||g.pruned!==0||g.pruneReason!=="chain-broken"){console.error(g); process.exit(1)} const err=fs.readFileSync(process.argv[2],"utf8"); if(err.indexOf("chain")===-1||err.indexOf("prune --force")===-1){console.error(err); process.exit(1)}' "$tmp/wrap-autoprune-broken.json" "$tmp/wrap-autoprune-broken.err"
          after=$(count_receipts | tr -d ' ')
          test "$after" = "$((before + 1))"
