# Org policy example — copy onto `.agent-receipt.yml` (merge local ignore rules).
# Docs: docs/business.md
#
# CI risk gate (scans the receipt; this is not doctor):
#   agent-receipt wrap --base main --json
#   exit 0 pass · exit 2 policy or verify failure · exit 1 usage error
#
# Checklist for laptops and scripts (does not scan diffs):
#   agent-receipt init --org        # set redact: true and failOn: high
#                                  # without replacing local ignore
#   agent-receipt doctor
#   agent-receipt doctor --strict   # unset redact+failOn always FAIL,
#                                  # even on a small or empty outDir.
#                                  # Unset retention also fails --strict
#                                  # on any outDir (init --retention).
#   agent-receipt doctor --json     # one JSON object on stdout; exits unchanged
#
# share redacts even when `redact` is false. This file turns redact on for
# capture / wrap / watch as well, and fails the gate on high-severity findings.
#
# capture, watch, wrap, share, and export append .agent-receipt/audit.jsonl
# (experimental hash chain, not a signature). List one kind with
# `audit --event wrap` (also capture, watch, share, export, prune).
# `audit --agent <name>` is an exact match (agent null does not match).
# `audit --failed` keeps failedOn or a nonzero exitCode. `--verify` ignores
# those filters and checks the whole chain.
# Receipts that failed the gate (index failedOn; older rows use high risk):
#   agent-receipt history --failed
#   agent-receipt history --agent ci --failed
# Prove-this-run (hash + audit link + signature status). Config failOn is
# not applied unless you pass --fail-on. Default verify stays hash-only.
#   agent-receipt verify --require-sig
#   agent-receipt prove --json
# Local Ed25519 attest (not a CA). Private key stays in .agent-receipt/keys/:
#   agent-receipt keygen
#   agent-receipt sign
# Known-keys allowlist (opt-in, not a CA). Empty = inactive.
# One lowercase 64-hex fingerprint per line in .agent-receipt/trusted-keys.txt
# and/or the list below. Union. verify --require-sig then requires a match.
# trustedFingerprints: []
# Newest receipt as one JSON object (wins over --path):
#   agent-receipt last --json
# doctor --strict always fails unset org policy (redact + failOn), including
# a small outDir, fails unset retention on any outDir, and fails a broken
# audit chain. Default doctor still pressure-gates unset retention.
# Tip: agent-receipt init --org
# Tip: agent-receipt init --retention
#   sets maxCount: 100 and maxAgeDays: 30 without replacing ignore / redact.
# Trusted prune: when .agent-receipt/audit.jsonl exists and the chain is
# broken, prune exits 1 and deletes nothing (dry-run too).
# Break-glass: agent-receipt prune --force
# prune appends one line per receipt it deletes and does not delete audit.jsonl.
# --dry-run does not append.
#
# Retention is opt-in. Leave maxCount and maxAgeDays unset until you want
# prune to delete. Uncomment to cap receipts, or run init --retention:
#   maxCount: 100
#   maxAgeDays: 30
# Then: agent-receipt prune --dry-run
# Docs: docs/business.md
# Gate JSON schema: docs/gate.schema.json (next to docs/receipt.schema.json)
# Signature sidecar: docs/signature.schema.json
# Drop-in CI: examples/github/action.yml and examples/github/pr-gate.yml
#   install pin: github:pramodreddyboddu/agent-receipt#v1.0.24
#   local allowlist (since v1.0.20): agent-receipt keygen && agent-receipt trust add --self
#   status (v1.0.23, read-only): agent-receipt trust show
#   handoff (v1.0.24): agent-receipt share --package   # HTML + Markdown; HTML unsigned
#   prove after a green gate; prove --page (v1.0.21) writes foo.prove.md; upload receipt-gate.json
# init --org does not set sign (keys may be absent). After keygen, uncomment:

outDir: .agent-receipt/receipts
defaultAgent: agent
defaultCommits: 1
fullDiffs: false

# Mask high/secret findings (credential URLs, API keys, nested receipt bodies).
redact: true

# capture / wrap / watch / share exit 2 when max severity is at least high.
# Plain `verify` stays integrity-only unless you pass --fail-on explicitly.
failOn: high

# sign: true  # after keygen; CLI --no-sign overrides

ignore:
  - node_modules/**
  - dist/**
  - coverage/**

riskAllowlist: []
