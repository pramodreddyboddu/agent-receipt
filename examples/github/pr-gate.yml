# Fail a pull request on agent-receipt --fail-on + --json.
# Copy to .github/workflows/agent-receipt-gate.yml
#
# Also reusable:
#   jobs:
#     receipt:
#       uses: pramodreddyboddu/agent-receipt/.github/workflows/agent-receipt-gate.yml@v1.0.14
#       with:
#         base: main
#         fail-on: high
#         command: wrap
#
# Install pin: npm install -g github:pramodreddyboddu/agent-receipt
# Or, once the tag exists: github:pramodreddyboddu/agent-receipt#v1.0.14
# Always pass --fail-on (this job does; default high) so a missing
# .agent-receipt.yml cannot silently weaken the gate.
# After a successful wrap or share, trailingIgnored is a boolean when set.
#
# Not installed as a live workflow in this repo: pushing .github/workflows
# needs the OAuth `workflow` scope. See docs/business.md.
name: agent-receipt gate

on:
  pull_request:
  workflow_call:
    inputs:
      base:
        description: Git ref for wrap --base. Empty uses github.base_ref when set.
        required: false
        type: string
        default: ""
      fail-on:
        description: high, medium, or low
        required: false
        type: string
        default: high
      command:
        description: wrap (default) or share
        required: false
        type: string
        default: wrap

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install agent-receipt
        run: |
          set -eu
          if ! command -v agent-receipt >/dev/null 2>&1; then
            # Pin the GitHub install. Use a tag once it exists, for example:
            #   npm install -g github:pramodreddyboddu/agent-receipt#v1.0.14
            npm install -g github:pramodreddyboddu/agent-receipt
          fi

      - name: Fail-on JSON gate
        env:
          FAIL_ON: ${{ inputs.fail-on || 'high' }}
          BASE_IN: ${{ inputs.base || github.base_ref }}
          GATE_CMD: ${{ inputs.command || 'wrap' }}
        run: |
          set -eu
          base="$BASE_IN"
          if [ -n "$base" ] && ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            if git rev-parse --verify "origin/$base" >/dev/null 2>&1; then
              base="origin/$base"
            fi
          fi
          out="$RUNNER_TEMP/receipt-gate.json"
          set +e
          if [ "$GATE_CMD" = "share" ]; then
            agent-receipt share --fail-on "$FAIL_ON" --json > "$out"
          else
            if [ -n "$base" ]; then
              agent-receipt wrap --base "$base" --fail-on "$FAIL_ON" --json > "$out"
            else
              agent-receipt wrap --fail-on "$FAIL_ON" --json > "$out"
            fi
          fi
          code=$?
          set -e
          echo "agent-receipt exit $code"
          cat "$out"
          # Exit code is the gate. Also require a JSON object so a usage
          # error that printed nothing cannot pass. --fail-on is always
          # passed above so a missing config cannot drop the risk gate.
          # trailingIgnored is a boolean when wrap/share verified a body
          # (null on capture). A non-boolean value fails the job.
          node -e 'const fs=require("fs"); const g=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (g.exitCode !== 0 || g.ok !== true) process.exit(g.exitCode || 1); if (g.trailingIgnored != null && typeof g.trailingIgnored !== "boolean") { console.error("trailingIgnored must be boolean when set"); process.exit(1); } if (typeof g.trailingIgnored === "boolean") console.log("trailingIgnored=" + g.trailingIgnored);' "$out"
          exit "$code"
